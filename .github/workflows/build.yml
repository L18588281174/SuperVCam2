name: Build SuperVCam Pro
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
      - name: Generate Source
        run: |
          mkdir -p .github/workflows
          
          cat > Makefile << 'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:15.0
          THEOS_PACKAGE_SCHEME = rootless
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = SuperVCam
          SuperVCam_FILES = Tweak.x VCAMProxy.m VCAMDataProvider.m
          SuperVCam_FRAMEWORKS = AVFoundation CoreMedia CoreVideo UIKit Foundation PhotosUI Photos AudioToolbox AVKit
          SuperVCam_CFLAGS = -fobjc-arc
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat > control << 'EOF'
          Package: com.yourname.supervcam
          Name: SuperVCam
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: Commercial Grade Virtual Camera
          Maintainer: yourname
          Author: yourname
          Section: Tweaks
          Depends: mobilesubstrate
          EOF

          cat > SuperVCam.plist << 'EOF'
          {
              Filter = {
                  Bundles = (
                      "com.apple.springboard",
                      "com.apple.camera"
                  );
              };
          }
          EOF

          # ================= 模块 1：DataProvider（安全缓冲池） =================
          cat > VCAMDataProvider.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <CoreVideo/CoreVideo.h>
          @interface VCAMDataProvider : NSObject
          + (instancetype)shared;
          - (void)updatePixelBuffer:(CVPixelBufferRef)newBuffer;
          - (CVPixelBufferRef)getLatestPixelBuffer;
          - (void)loadTestImage;
          @end
          EOF

          cat > VCAMDataProvider.m << 'EOF'
          #import "VCAMDataProvider.h"
          #import <UIKit/UIKit.h>

          @interface VCAMDataProvider () {
              CVPixelBufferRef _currentBuffer;
              NSLock *_bufferLock;
          }
          @end

          @implementation VCAMDataProvider
          + (instancetype)shared {
              static VCAMDataProvider *inst;
              static dispatch_once_t once;
              dispatch_once(&once, ^{ inst = [VCAMDataProvider new]; });
              return inst;
          }
          - (instancetype)init {
              self = [super init];
              if (self) {
                  _bufferLock = [[NSLock alloc] init];
              }
              return self;
          }
          - (void)updatePixelBuffer:(CVPixelBufferRef)newBuffer {
              [_bufferLock lock];
              if (_currentBuffer) CVPixelBufferRelease(_currentBuffer);
              if (newBuffer) _currentBuffer = CVPixelBufferRetain(newBuffer);
              [_bufferLock unlock];
          }
          - (CVPixelBufferRef)getLatestPixelBuffer {
              [_bufferLock lock];
              CVPixelBufferRef out = _currentBuffer ? CVPixelBufferRetain(_currentBuffer) : NULL;
              [_bufferLock unlock];
              return out;
          }

          // 测试用：生成一张红色的假图作为 PixelBuffer
          - (void)loadTestImage {
              NSDictionary *attrs = @{
                  (id)kCVPixelBufferPixelFormatTypeKey: @(kCVPixelFormatType_32BGRA),
                  (id)kCVPixelBufferWidthKey: @(1080),
                  (id)kCVPixelBufferHeightKey: @(1920)
              };
              CVPixelBufferRef pb = NULL;
              CVPixelBufferCreate(kCFAllocatorDefault, 1080, 1920, kCVPixelFormatType_32BGRA, (__bridge CFDictionaryRef)attrs, &pb);
              
              // 填充红色
              CVPixelBufferLockBaseAddress(pb, 0);
              void *baseAddress = CVPixelBufferGetBaseAddress(pb);
              size_t bytesPerRow = CVPixelBufferGetBytesPerRow(pb);
              memset(baseAddress, 255, bytesPerRow * 1920); // 简单粗暴全红
              CVPixelBufferUnlockBaseAddress(pb, 0);
              
              [self updatePixelBuffer:pb];
              CVPixelBufferRelease(pb);
          }
          @end
          EOF

          # ================= 模块 2：Proxy（双面间谍） =================
          cat > VCAMProxy.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <AVFoundation/AVFoundation.h>
          @interface VCAMProxy : NSObject <AVCaptureVideoDataOutputSampleBufferDelegate>
          @property (nonatomic, weak) id<AVCaptureVideoDataOutputSampleBufferDelegate> originalDelegate;
          @end
          EOF

          cat > VCAMProxy.m << 'EOF'
          #import "VCAMProxy.h"
          #import "VCAMDataProvider.h"

          @implementation VCAMProxy
          - (void)captureOutput:(AVCaptureOutput *)output didOutputSampleBuffer:(CMSampleBufferRef)sampleBuffer fromConnection:(AVCaptureConnection *)connection {
              CVPixelBufferRef fakePB = [[VCAMDataProvider shared] getLatestPixelBuffer];
              
              // 如果没准备假帧，或者没开启替换，直接原样透传
              if (!fakePB) {
                  [self.originalDelegate captureOutput:output didOutputSampleBuffer:sampleBuffer fromConnection:connection];
                  return;
              }

              CMVideoFormatDescriptionRef fmtDesc;
              CMVideoFormatDescriptionCreateForImageBuffer(kCFAllocatorDefault, fakePB, &fmtDesc);
              
              // 严格对齐时间戳！绝不能乱写
              CMTime pts = CMClockGetTime(CMClockGetHostTimeClock());
              CMSampleTimingInfo timing = { .duration = CMTimeMake(1, 30), .presentationTimeStamp = pts, .decodeTimeStamp = kCMTimeInvalid };
              
              CMSampleBufferRef fakeSB;
              CMSampleBufferCreateReadyWithImageBuffer(kCFAllocatorDefault, fakePB, fmtDesc, &timing, &fakeSB);
              
              // 继承原帧的附件（极其关键）
              CFArrayRef attachmentsArray = CMSampleBufferGetSampleAttachmentsArray(sampleBuffer, false);
              if (attachmentsArray && CFArrayGetCount(attachmentsArray) > 0) {
                  CFDictionaryRef attachments = CFArrayGetValueAtIndex(attachmentsArray, 0);
                  CMSetAttachments(fakeSB, attachments, kCMAttachmentMode_ShouldPropagate);
              }

              // 喂给真正的 App
              [self.originalDelegate captureOutput:output didOutputSampleBuffer:fakeSB fromConnection:connection];
              
              // 必须释放，否则爆内存
              CFRelease(fakeSB);
              CFRelease(fmtDesc);
              CVPixelBufferRelease(fakePB);
          }
          @end
          EOF

          # ================= 模块 3：Tweak.x（UI 与 Hook） =================
          cat > Tweak.x << 'EOF'
          #import <AVFoundation/AVFoundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import "VCAMProxy.h"
          #import "VCAMDataProvider.h"

          // 极简 UI
          @interface VCamWindow : UIWindow
          @end
          @implementation VCamWindow
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.windowLevel = UIWindowLevelAlert + 1000;
                  self.backgroundColor = [UIColor clearColor];
                  self.rootViewController = [[UIViewController alloc] init];
                  self.rootViewController.view.backgroundColor = [UIColor clearColor];
                  
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
                  btn.frame = CGRectMake(50, 150, 150, 50);
                  btn.backgroundColor = [UIColor redColor];
                  [btn setTitle:@"开启替换(红屏)" forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  [btn addTarget:self action:@selector(toggle) forControlEvents:UIControlEventTouchUpInside];
                  [self.rootViewController.view addSubview:btn];
              }
              return self;
          }
          - (void)toggle {
              BOOL isEnabled = [[NSUserDefaults standardUserDefaults] boolForKey:@"VCamEnabled"];
              [[NSUserDefaults standardUserDefaults] setBool:!isEnabled forKey:@"VCamEnabled"];
              [[NSUserDefaults standardUserDefaults] synchronize];
              
              if (!isEnabled) {
                  [[VCAMDataProvider shared] loadTestImage]; // 开启时，加载红色假画面
              } else {
                  [[VCAMDataProvider shared] updatePixelBuffer:NULL]; // 关闭时，清空假画面
              }
          }
          @end

          static VCamWindow *uiWindow = nil;

          // 核心 Hook：拦截代理设置
          %hook AVCaptureVideoDataOutput
          - (void)setSampleBufferDelegate:(id<AVCaptureVideoDataOutputSampleBufferDelegate>)delegate queue:(dispatch_queue_t)queue {
              // 1. 先让系统正常绑定原代理
              %orig;
              
              if (!delegate) return;
              
              // 2. 把自己的“间谍”插进去
              VCAMProxy *proxy = [VCAMProxy new];
              proxy.originalDelegate = delegate;
              
              // 3. 强制系统把代理换成我们
              %orig(proxy, queue);
              NSLog(@"[SuperVCam] 成功劫持相机代理！原代理: %@", delegate);
          }
          %end

          __attribute__((constructor)) static void initVCam() {
              if ([[NSProcessInfo processInfo].processName isEqualToString:@"SpringBoard"]) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      uiWindow = [[VCamWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                      uiWindow.hidden = NO;
                  });
              }
          }
          EOF

      - name: Build
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SuperVCam-Deb
          path: packages/*.deb
