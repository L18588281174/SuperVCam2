name: Build SuperVCam Pro
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
      - name: Generate Source Files
        run: |
          mkdir -p .github/workflows
          
          cat > Makefile << 'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:15.0
          THEOS_PACKAGE_SCHEME = rootless
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = SuperVCam
          SuperVCam_FILES = Tweak.x VCFrameEngine.m
          SuperVCam_FRAMEWORKS = AVFoundation CoreMedia CoreVideo CoreImage UIKit Foundation PhotosUI Photos AudioToolbox
          SuperVCam_CFLAGS = -fobjc-arc
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat > control << 'EOF'
          Package: com.yourname.supervcam
          Name: SuperVCam
          Version: 2.0.0
          Architecture: iphoneos-arm64
          Description: Ultimate Virtual Camera
          Maintainer: yourname
          Author: yourname
          Section: Tweaks
          Depends: mobilesubstrate
          EOF

          cat > SuperVCam.plist << 'EOF'
          {
              Filter = {
                  Bundles = (
                      "com.apple.camera"
                  );
              };
          }
          EOF

          cat > VCFrameEngine.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <AVFoundation/AVFoundation.h>
          #import <UIKit/UIKit.h>
          @interface VCFrameEngine : NSObject
          + (instancetype)shared;
          @property (nonatomic, assign) BOOL isEnabled;
          @property (nonatomic, assign) BOOL mirrorH;
          - (void)loadVideoURL:(NSURL *)url;
          - (CMSampleBufferRef)nextSampleBuffer CF_RETURNS_RETAINED;
          @end
          EOF

          cat > VCFrameEngine.m << 'EOF'
          #import <QuartzCore/QuartzCore.h>
          #import <CoreImage/CoreImage.h>
          #import "VCFrameEngine.h"

          @interface VCFrameEngine () {
              AVAssetReader *_reader;
              AVAssetReaderTrackOutput *_readerOutput;
              NSURL *_videoURL;
              CVPixelBufferPoolRef _pool;
              CMVideoFormatDescriptionRef _formatDesc;
          }
          @end

          @implementation VCFrameEngine
          + (instancetype)shared {
              static VCFrameEngine *inst;
              static dispatch_once_t once;
              dispatch_once(&once, ^{ inst = [VCFrameEngine new]; });
              return inst;
          }
          - (instancetype)init {
              self = [super init];
              if (self) {
                  NSDictionary *attrs = @{
                      (id)kCVPixelBufferPixelFormatTypeKey: @(kCVPixelFormatType_32BGRA),
                      (id)kCVPixelBufferWidthKey: @(1080),
                      (id)kCVPixelBufferHeightKey: @(1920)
                  };
                  CVPixelBufferPoolCreate(kCFAllocatorDefault, NULL, (__bridge CFDictionaryRef)attrs, &_pool);
                  CVPixelBufferRef pb = NULL;
                  CVPixelBufferPoolCreatePixelBuffer(kCFAllocatorDefault, _pool, &pb);
                  CMVideoFormatDescriptionCreateForImageBuffer(kCFAllocatorDefault, pb, &_formatDesc);
                  CVPixelBufferRelease(pb);
              }
              return self;
          }
          - (void)loadVideoURL:(NSURL *)url {
              _videoURL = url;
              [self rebuildReader];
          }
          - (void)rebuildReader {
              [_reader cancelReading];
              AVAsset *asset = [AVAsset assetWithURL:_videoURL];
              _reader = [AVAssetReader assetReaderWithAsset:asset error:nil];
              AVAssetTrack *track = [[asset tracksWithMediaType:AVMediaTypeVideo] firstObject];
              if (track) {
                  _readerOutput = [AVAssetReaderTrackOutput assetReaderTrackOutputWithTrack:track outputSettings:@{
                      (id)kCVPixelBufferPixelFormatTypeKey: @(kCVPixelFormatType_32BGRA)
                  }];
                  _readerOutput.alwaysCopiesSampleData = NO;
                  [_reader addOutput:_readerOutput];
                  [_reader startReading];
              }
          }
          - (CMSampleBufferRef)nextSampleBuffer CF_RETURNS_RETAINED {
              if (!_isEnabled || !_videoURL) return NULL;
              if (!_reader || _reader.status != AVAssetReaderStatusReading) {
                  [self rebuildReader];
              }
              CMSampleBufferRef sb = [_readerOutput copyNextSampleBuffer];
              if (!sb) {
                  [self rebuildReader];
                  sb = [_readerOutput copyNextSampleBuffer];
                  if (!sb) return NULL;
              }
              CVPixelBufferRef imgBuf = CMSampleBufferGetImageBuffer(sb);
              CIImage *ciImage = [CIImage imageWithCVPixelBuffer:imgBuf];
              if (_mirrorH) {
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeScale(-1, 1)];
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeTranslation(1080, 0)];
              }
              CVPixelBufferRef newBuf = NULL;
              CVPixelBufferPoolCreatePixelBuffer(kCFAllocatorDefault, _pool, &newBuf);
              static CIContext *context = nil;
              if (!context) context = [CIContext contextWithOptions:@{kCIContextUseSoftwareRenderer: @NO}];
              [context render:ciImage toCVPixelBuffer:newBuf];
              CMSampleTimingInfo timing = { .duration = CMTimeMake(1, 30), .presentationTimeStamp = CMClockGetTime(CMClockGetHostTimeClock()), .decodeTimeStamp = kCMTimeInvalid };
              CMSampleBufferRef finalSb = NULL;
              CMSampleBufferCreateReadyWithImageBuffer(kCFAllocatorDefault, newBuf, _formatDesc, &timing, &finalSb);
              CVPixelBufferRelease(newBuf);
              CFRelease(sb);
              return finalSb;
          }
          @end
          EOF

          cat > Tweak.x << 'EOF'
          #import <AVFoundation/AVFoundation.h>
          #import <UIKit/UIKit.h>
          #import <PhotosUI/PhotosUI.h>
          #import <objc/runtime.h>
          #import "VCFrameEngine.h"

          // 界面部分完全用标准 OC 写，避开 Logos
          @interface VCamWindow : UIWindow
          @property (nonatomic, strong) UIButton *toggleBtn;
          @property (nonatomic, strong) UIButton *mirrorBtn;
          @end

          @interface VCamWindow () <PHPickerViewControllerDelegate>
          @end

          @implementation VCamWindow
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.windowLevel = UIWindowLevelAlert + 1;
                  self.backgroundColor = [UIColor colorWithWhite:0 alpha:0.85];
                  self.layer.cornerRadius = 15;
                  self.clipsToBounds = YES;
                  
                  self.toggleBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  self.toggleBtn.frame = CGRectMake(5, 5, 130, 30);
                  [self.toggleBtn setTitle:@"开关替换" forState:UIControlStateNormal];
                  [self.toggleBtn setTitleColor:[UIColor greenColor] forState:UIControlStateNormal];
                  [self.toggleBtn addTarget:self action:@selector(toggleVCam) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:self.toggleBtn];
                  
                  UIButton *pickBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  pickBtn.frame = CGRectMake(5, 40, 130, 30);
                  [pickBtn setTitle:@"从相册选择" forState:UIControlStateNormal];
                  [pickBtn setTitleColor:[UIColor cyanColor] forState:UIControlStateNormal];
                  [pickBtn addTarget:self action:@selector(pickVideo) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:pickBtn];
                  
                  self.mirrorBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  self.mirrorBtn.frame = CGRectMake(5, 75, 130, 30);
                  [self.mirrorBtn setTitle:@"开启镜像" forState:UIControlStateNormal];
                  [self.mirrorBtn setTitleColor:[UIColor yellowColor] forState:UIControlStateNormal];
                  [self.mirrorBtn addTarget:self action:@selector(toggleMirror) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:self.mirrorBtn];
              }
              return self;
          }

          - (void)toggleVCam {
              [VCFrameEngine shared].isEnabled = ![VCFrameEngine shared].isEnabled;
              [self.toggleBtn setTitle:[VCFrameEngine shared].isEnabled ? @"关闭替换" : @"开启替换" forState:UIControlStateNormal];
          }

          - (void)toggleMirror {
              [VCFrameEngine shared].mirrorH = ![VCFrameEngine shared].mirrorH;
              [self.mirrorBtn setTitle:[VCFrameEngine shared].mirrorH ? @"关闭镜像" : @"开启镜像" forState:UIControlStateNormal];
          }

          // 暴力获取顶层控制器
          - (UIViewController *)getTopVC {
              id app = ((id (*)(id, SEL))objc_msgSend)((id)objc_getClass("UIApplication"), sel_registerName("sharedApplication"));
              id window = ((id (*)(id, SEL))objc_msgSend)(app, sel_registerName("keyWindow"));
              if (!window) {
                  NSArray *wins = ((NSArray * (*)(id, SEL))objc_msgSend)(app, sel_registerName("windows"));
                  if (wins.count > 0) window = wins.firstObject;
              }
              UIViewController *vc = ((UIViewController * (*)(id, SEL))objc_msgSend)(window, sel_registerName("rootViewController"));
              while (vc.presentedViewController) vc = vc.presentedViewController;
              return vc;
          }

          - (void)pickVideo {
              self.hidden = YES;
              PHPickerConfiguration *config = [[PHPickerConfiguration alloc] init];
              config.filter = PHPickerFilter.videosFilter;
              PHPickerViewController *picker = [[PHPickerViewController alloc] initWithConfiguration:config];
              picker.delegate = (id<PHPickerViewControllerDelegate>)self;
              [[self getTopVC] presentViewController:picker animated:YES completion:nil];
          }

          - (void)picker:(PHPickerViewController *)picker didFinishPicking:(NSArray<PHPickerResult *> *)results {
              [picker dismissViewControllerAnimated:YES completion:nil];
              if (results.count > 0) {
                  NSItemProvider *provider = results.firstObject.itemProvider;
                  if ([provider hasItemConformingToTypeIdentifier:@"public.movie"]) {
                      [provider loadFileRepresentationForTypeIdentifier:@"public.movie" completionHandler:^(NSURL *url, NSError *error) {
                          if (url) {
                              NSString *destPath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"vcam_video.mp4"];
                              NSURL *destURL = [NSURL fileURLWithPath:destPath];
                              [[NSFileManager defaultManager] removeItemAtURL:destURL error:nil];
                              [[NSFileManager defaultManager] copyItemAtURL:url toURL:destURL error:nil];
                              
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  [[VCFrameEngine shared] loadVideoURL:destURL];
                                  [VCFrameEngine shared].isEnabled = YES;
                              });
                          }
                      }];
                  }
              }
              self.hidden = NO;
          }
          @end

          static VCamWindow *menuWindow = nil;

          @interface VCFrameInterceptor : NSObject <AVCaptureVideoDataOutputSampleBufferDelegate>
          @property (nonatomic, weak) id<AVCaptureVideoDataOutputSampleBufferDelegate> realDelegate;
          @end

          @implementation VCFrameInterceptor
          - (void)captureOutput:(AVCaptureOutput *)output didOutputSampleBuffer:(CMSampleBufferRef)sampleBuffer fromConnection:(AVCaptureConnection *)connection {
              CMSampleBufferRef vBuf = [[VCFrameEngine shared] nextSampleBuffer];
              if (vBuf) {
                  [self.realDelegate captureOutput:output didOutputSampleBuffer:vBuf fromConnection:connection];
                  CFRelease(vBuf);
              } else {
                  [self.realDelegate captureOutput:output didOutputSampleBuffer:sampleBuffer fromConnection:connection];
              }
          }
          @end

          // 终极底层 Hook，绝不崩溃
          __attribute__((constructor)) static void initVCam() {
              Class cls = objc_getClass("AVCaptureVideoDataOutput");
              SEL sel = sel_registerName("setSampleBufferDelegate:queue:");
              Method method = class_getInstanceMethod(cls, sel);
              if (!method) return;

              IMP originalIMP = method_getImplementation(method);
              IMP newIMP = imp_implementationWithBlock(^void(id _self, id delegate, dispatch_queue_t queue) {
                  if (!delegate) {
                      ((void (*)(id, SEL, id, dispatch_queue_t))originalIMP)(_self, sel, delegate, queue);
                      return;
                  }
                  
                  VCFrameInterceptor *interceptor = [VCFrameInterceptor new];
                  interceptor.realDelegate = delegate;
                  ((void (*)(id, SEL, id, dispatch_queue_t))originalIMP)(_self, sel, interceptor, queue);
                  
                  // 打开相机时自动弹出悬浮窗
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (!menuWindow) {
                          menuWindow = [[VCamWindow alloc] initWithFrame:CGRectMake(20, 100, 140, 110)];
                      }
                      menuWindow.hidden = NO;
                  });
              });
              
              method_setImplementation(method, newIMP);
          }
          EOF

      - name: Build Tweak
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: SuperVCam-Deb
          path: packages/*.deb
