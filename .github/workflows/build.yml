name: Build SuperVCam Pro
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
      - name: Generate Source
        run: |
          mkdir -p .github/workflows
          
          cat > Makefile << 'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:15.0
          THEOS_PACKAGE_SCHEME = rootless
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = SuperVCam
          SuperVCam_FILES = Tweak.x VCFrameEngine.m
          SuperVCam_FRAMEWORKS = AVFoundation CoreMedia CoreVideo UIKit Foundation PhotosUI Photos AudioToolbox AVKit
          SuperVCam_CFLAGS = -fobjc-arc
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat > control << 'EOF'
          Package: com.yourname.supervcam
          Name: SuperVCam
          Version: 20.0.1
          Architecture: iphoneos-arm64
          Description: True Hook Interceptor Virtual Camera
          Maintainer: yourname
          Author: yourname
          Section: Tweaks
          Depends: mobilesubstrate
          EOF

          cat > SuperVCam.plist << 'EOF'
          {
              Filter = {
                  Bundles = (
                      "com.apple.springboard",
                      "com.apple.camera"
                  );
              };
          }
          EOF

          cat > VCFrameEngine.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <AVFoundation/AVFoundation.h>
          #import <UIKit/UIKit.h>
          @interface VCFrameEngine : NSObject
          + (instancetype)shared;
          @property (nonatomic, assign) BOOL isEnabled;
          - (void)loadVideoURL:(NSURL *)url;
          - (void)syncState;
          - (CMSampleBufferRef)replaceSampleBuffer:(CMSampleBufferRef)originalBuffer CF_RETURNS_RETAINED;
          @end
          EOF

          cat > VCFrameEngine.m << 'EOF'
          #import <CoreImage/CoreImage.h>
          #import "VCFrameEngine.h"

          @interface VCFrameEngine () {
              AVAssetReader *_reader;
              AVAssetReaderTrackOutput *_readerOutput;
              NSURL *_videoURL;
              CIContext *_ciContext;
          }
          @end

          @implementation VCFrameEngine
          + (instancetype)shared {
              static VCFrameEngine *inst;
              static dispatch_once_t once;
              dispatch_once(&once, ^{ inst = [VCFrameEngine new]; });
              return inst;
          }
          - (instancetype)init {
              self = [super init];
              if (self) {
                  _ciContext = [CIContext contextWithOptions:@{kCIContextUseSoftwareRenderer: @NO}];
              }
              return self;
          }
          - (void)syncState {
              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
              self.isEnabled = [defaults boolForKey:@"VCamEnabled"];
          }
          - (void)loadVideoURL:(NSURL *)url {
              _videoURL = url;
              [self rebuildReader];
          }
          - (void)rebuildReader {
              [_reader cancelReading];
              if (!_videoURL) return;
              AVAsset *asset = [AVAsset assetWithURL:_videoURL];
              _reader = [AVAssetReader assetReaderWithAsset:asset error:nil];
              AVAssetTrack *track = [[asset tracksWithMediaType:AVMediaTypeVideo] firstObject];
              if (track) {
                  _readerOutput = [AVAssetReaderTrackOutput assetReaderTrackOutputWithTrack:track outputSettings:@{
                      (id)kCVPixelBufferPixelFormatTypeKey: @(kCVPixelFormatType_32BGRA)
                  }];
                  _readerOutput.alwaysCopiesSampleData = NO;
                  [_reader addOutput:_readerOutput];
                  [_reader startReading];
              }
          }

          - (CMSampleBufferRef)replaceSampleBuffer:(CMSampleBufferRef)originalBuffer CF_RETURNS_RETAINED {
              if (!self.isEnabled || !_videoURL) return NULL;
              if (!_reader || _reader.status != AVAssetReaderStatusReading) [self rebuildReader];
              
              CMSampleBufferRef videoSb = [_readerOutput copyNextSampleBuffer];
              if (!videoSb) {
                  [self rebuildReader];
                  videoSb = [_readerOutput copyNextSampleBuffer];
                  if (!videoSb) return NULL;
              }
              
              CVImageBufferRef originalImage = CMSampleBufferGetImageBuffer(originalBuffer);
              if (!originalImage) { CFRelease(videoSb); return NULL; }
              
              size_t targetWidth = CVPixelBufferGetWidth(originalImage);
              size_t targetHeight = CVPixelBufferGetHeight(originalImage);
              OSType pixelFormat = CVPixelBufferGetPixelFormatType(originalImage);
              CMFormatDescriptionRef originalFormat = CMSampleBufferGetFormatDescription(originalBuffer);
              
              CVPixelBufferRef videoImage = CMSampleBufferGetImageBuffer(videoSb);
              CIImage *ciImage = [CIImage imageWithCVPixelBuffer:videoImage];
              
              CGFloat scaleX = targetWidth / ciImage.extent.size.width;
              CGFloat scaleY = targetHeight / ciImage.extent.size.height;
              ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeScale(scaleX, scaleY)];
              ciImage = [ciImage imageByCroppingToRect:CGRectMake(0, 0, targetWidth, targetHeight)];
              
              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
              if ([defaults boolForKey:@"VCamMirror"]) {
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeScale(-1, 1)];
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeTranslation(targetWidth, 0)];
              }
              
              CFDictionaryRef emptyAttrs = (__bridge CFDictionaryRef)@{(id)kCVPixelBufferIOSurfacePropertiesKey: @{}};
              CVPixelBufferRef newBuf = NULL;
              CVPixelBufferCreate(kCFAllocatorDefault, targetWidth, targetHeight, pixelFormat, emptyAttrs, &newBuf);
              if (newBuf) {
                  [_ciContext render:ciImage toCVPixelBuffer:newBuf];
              }
              
              CMSampleTimingInfo timing = { 
                  .duration = CMTimeMake(1, 30), 
                  .presentationTimeStamp = CMClockGetTime(CMClockGetHostTimeClock()), 
                  .decodeTimeStamp = kCMTimeInvalid 
              };
              CMSampleBufferRef finalSb = NULL;
              CMSampleBufferCreateReadyWithImageBuffer(kCFAllocatorDefault, newBuf, originalFormat, &timing, &finalSb);
              
              CFArrayRef attachmentsArray = CMSampleBufferGetSampleAttachmentsArray(originalBuffer, false);
              if (attachmentsArray && CFArrayGetCount(attachmentsArray) > 0) {
                  CFDictionaryRef attachments = CFArrayGetValueAtIndex(attachmentsArray, 0);
                  CMSetAttachments(finalSb, attachments, kCMAttachmentMode_ShouldPropagate);
              }
              
              if (newBuf) CVPixelBufferRelease(newBuf);
              CFRelease(videoSb);
              return finalSb;
          }
          @end
          EOF

          cat > Tweak.x << 'EOF'
          #import <AVFoundation/AVFoundation.h>
          #import <AVKit/AVKit.h>
          #import <UIKit/UIKit.h>
          #import <PhotosUI/PhotosUI.h>
          #import <objc/runtime.h>
          #import "VCFrameEngine.h"

          @interface VCamPassthroughWindow : UIWindow <UIGestureRecognizerDelegate>
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) UIButton *ballBtn;
          @property (nonatomic, strong) UIButton *mainSwitchBtn;
          @property (nonatomic, strong) UIView *previewContainer;
          @property (nonatomic, strong) AVPlayer *previewPlayer;
          @property (nonatomic, strong) AVPlayerLayer *previewLayer;
          @property (nonatomic, strong) NSMutableArray *gridButtons;
          @end

          @interface VCamPassthroughWindow () <PHPickerViewControllerDelegate>
          @end

          @implementation VCamPassthroughWindow
          
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              if (hitView == self || hitView == self.rootViewController.view) return nil; 
              return hitView;
          }

          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.windowLevel = UIWindowLevelAlert + 2000;
                  self.backgroundColor = [UIColor clearColor];
                  self.rootViewController = [[UIViewController alloc] init];
                  self.rootViewController.view.backgroundColor = [UIColor clearColor];
                  
                  UITapGestureRecognizer *tapOutside = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(minimizePanel)];
                  tapOutside.cancelsTouchesInView = NO;
                  tapOutside.delegate = self;
                  [self.rootViewController.view addGestureRecognizer:tapOutside];

                  self.ballBtn = [UIButton buttonWithType:UIButtonTypeCustom];
                  self.ballBtn.frame = CGRectMake(0, 0, 50, 50);
                  self.ballBtn.backgroundColor = [UIColor colorWithRed:0 green:150/255.0 blue:255/255.0 alpha:0.8];
                  self.ballBtn.layer.cornerRadius = 25;
                  [self.ballBtn setTitle:@"V" forState:UIControlStateNormal];
                  [self.ballBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  self.ballBtn.titleLabel.font = [UIFont boldSystemFontOfSize:24];
                  [self.ballBtn addTarget:self action:@selector(expandPanel) forControlEvents:UIControlEventTouchUpInside];
                  [self.rootViewController.view addSubview:self.ballBtn];
                  
                  self.panel = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 300, 340)];
                  self.panel.backgroundColor = [UIColor colorWithRed:15/255.0 green:20/255.0 blue:30/255.0 alpha:0.95];
                  self.panel.layer.cornerRadius = 20;
                  self.panel.hidden = YES;
                  [self.rootViewController.view addSubview:self.panel];
                  
                  UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
                  [self.ballBtn addGestureRecognizer:pan];
                  
                  UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(15, 10, 200, 20)];
                  title.text = @"SuperVCam 控制台";
                  title.textColor = [UIColor cyanColor];
                  title.font = [UIFont boldSystemFontOfSize:14];
                  [self.panel addSubview:title];
                  
                  UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  closeBtn.frame = CGRectMake(260, 5, 30, 30);
                  [closeBtn setTitle:@"✖" forState:UIControlStateNormal];
                  [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  [closeBtn addTarget:self action:@selector(minimizePanel) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:closeBtn];
                  
                  UIButton *pickBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  pickBtn.frame = CGRectMake(15, 40, 270, 40);
                  pickBtn.backgroundColor = [UIColor colorWithRed:0 green:122/255.0 blue:1 alpha:1];
                  pickBtn.layer.cornerRadius = 8;
                  [pickBtn setTitle:@"🎬 第一步：选择本地视频" forState:UIControlStateNormal];
                  [pickBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  [pickBtn addTarget:self action:@selector(pickVideo) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:pickBtn];
                  
                  self.previewContainer = [[UIView alloc] initWithFrame:CGRectMake(15, 90, 270, 80)];
                  self.previewContainer.backgroundColor = [UIColor blackColor];
                  self.previewContainer.layer.cornerRadius = 8;
                  self.previewContainer.clipsToBounds = YES;
                  [self.panel addSubview:self.previewContainer];
                  
                  self.previewLayer = [AVPlayerLayer playerLayerWithPlayer:nil];
                  self.previewLayer.frame = self.previewContainer.bounds;
                  self.previewLayer.videoGravity = AVLayerVideoGravityResizeAspect;
                  [self.previewContainer.layer addSublayer:self.previewLayer];
                  
                  self.mainSwitchBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  self.mainSwitchBtn.frame = CGRectMake(15, 180, 270, 40);
                  self.mainSwitchBtn.layer.cornerRadius = 8;
                  [self.mainSwitchBtn addTarget:self action:@selector(toggleMainSwitch) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:self.mainSwitchBtn];
                  
                  self.gridButtons = [NSMutableArray array];
                  NSArray *titles = @[@"原声", @"循环", @"旋转", @"镜像", @"麦克风", @"重置"];
                  for (int i = 0; i < 6; i++) {
                      UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
                      btn.frame = CGRectMake(15 + (i%3) * 92, 240 + (i/3) * 45, 86, 35);
                      btn.layer.cornerRadius = 8;
                      btn.backgroundColor = [UIColor colorWithWhite:1 alpha:0.1];
                      [btn setTitle:titles[i] forState:UIControlStateNormal];
                      [btn setTitleColor:[UIColor lightGrayColor] forState:UIControlStateNormal];
                      btn.tag = i;
                      [btn addTarget:self action:@selector(handleGridTap:) forControlEvents:UIControlEventTouchUpInside];
                      [self.panel addSubview:btn];
                      [self.gridButtons addObject:btn];
                  }
                  [self refreshUI];
              }
              return self;
          }

          - (BOOL)gestureRecognizer:(UIGestureRecognizer *)gestureRecognizer shouldReceiveTouch:(UITouch *)touch {
              if ([touch.view isDescendantOfView:self.panel]) return NO;
              return YES;
          }

          - (void)expandPanel { 
              self.panel.hidden = NO; 
              [self.previewPlayer play]; 
          }
          - (void)minimizePanel { 
              self.panel.hidden = YES; 
              [self.previewPlayer pause]; 
          }

          - (void)refreshUI {
              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
              BOOL hasVideo = [defaults objectForKey:@"VCamVideoPath"] != nil;
              if (!hasVideo) {
                  [self.mainSwitchBtn setTitle:@"⚠️ 请先选择视频" forState:UIControlStateNormal];
                  self.mainSwitchBtn.backgroundColor = [UIColor grayColor];
                  self.mainSwitchBtn.enabled = NO;
              } else {
                  self.mainSwitchBtn.enabled = YES;
                  BOOL isOn = [defaults boolForKey:@"VCamEnabled"];
                  [self.mainSwitchBtn setTitle:isOn ? @"🟢 替换已开启 (点击关闭)" : @"🔴 替换已关闭 (点击开启)" forState:UIControlStateNormal];
                  self.mainSwitchBtn.backgroundColor = isOn ? [UIColor colorWithRed:0 green:200/255.0 blue:100/255.0 alpha:1] : [UIColor colorWithRed:200/255.0 green:50/255.0 blue:50/255.0 alpha:1];
              }
              
              BOOL isAudio = [defaults boolForKey:@"VCamAudio"];
              [self updateBtn:0 text:isAudio ? @"🔊 原声: 开" : @"🔇 原声: 关" active:isAudio];
              [self updateBtn:1 text:@"🔁 循环: 开" active:YES];
              NSInteger angle = [defaults integerForKey:@"VCamRotation"];
              [self updateBtn:2 text:[NSString stringWithFormat:@"🔄 旋转: %ld°", (long)angle] active:angle!=0];
              BOOL isMirror = [defaults boolForKey:@"VCamMirror"];
              [self updateBtn:3 text:isMirror ? @"↔️ 镜像: 开" : @"↔️ 镜像: 关" active:isMirror];
          }

          - (void)updateBtn:(NSInteger)tag text:(NSString *)text active:(BOOL)active {
              UIButton *btn = self.gridButtons[tag];
              [btn setTitle:text forState:UIControlStateNormal];
              btn.backgroundColor = active ? [UIColor colorWithRed:0 green:200/255.0 blue:100/255.0 alpha:1] : [UIColor colorWithWhite:1 alpha:0.1];
          }

          - (void)toggleMainSwitch {
              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
              BOOL isOn = [defaults boolForKey:@"VCamEnabled"];
              [defaults setBool:!isOn forKey:@"VCamEnabled"];
              [defaults synchronize];
              CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.supervcam.toggle"), NULL, NULL, YES);
              [self refreshUI];
          }

          - (void)handleGridTap:(UIButton *)sender {
              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
              NSInteger tag = sender.tag;
              if (tag == 0) {
                  BOOL isAudio = [defaults boolForKey:@"VCamAudio"];
                  [defaults setBool:!isAudio forKey:@"VCamAudio"];
              } else if (tag == 2) {
                  NSInteger angle = [defaults integerForKey:@"VCamRotation"];
                  angle = (angle + 90) % 360;
                  [defaults setInteger:angle forKey:@"VCamRotation"];
              } else if (tag == 3) {
                  BOOL isMirror = [defaults boolForKey:@"VCamMirror"];
                  [defaults setBool:!isMirror forKey:@"VCamMirror"];
              } else if (tag == 5) {
                  [defaults setInteger:0 forKey:@"VCamRotation"];
                  [defaults setBool:NO forKey:@"VCamMirror"];
              }
              [defaults synchronize];
              CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.supervcam.toggle"), NULL, NULL, YES);
              [self refreshUI];
          }

          - (void)handlePan:(UIPanGestureRecognizer *)pan {
              CGPoint translation = [pan translationInView:self];
              CGPoint newCenter = CGPointMake(self.ballBtn.center.x + translation.x, self.ballBtn.center.y + translation.y);
              self.panel.center = CGPointMake(self.panel.center.x + translation.x, self.panel.center.y + translation.y);
              self.ballBtn.center = newCenter;
              [pan setTranslation:CGPointZero inView:self];
          }

          - (void)pickVideo {
              PHPickerConfiguration *config = [[PHPickerConfiguration alloc] init];
              config.filter = PHPickerFilter.videosFilter;
              PHPickerViewController *picker = [[PHPickerViewController alloc] initWithConfiguration:config];
              picker.delegate = (id<PHPickerViewControllerDelegate>)self;
              [self.rootViewController presentViewController:picker animated:YES completion:nil];
          }

          - (void)picker:(PHPickerViewController *)picker didFinishPicking:(NSArray<PHPickerResult *> *)results {
              [picker dismissViewControllerAnimated:YES completion:nil];
              if (results.count > 0) {
                  NSItemProvider *provider = results.firstObject.itemProvider;
                  if ([provider hasItemConformingToTypeIdentifier:@"public.movie"]) {
                      [provider loadFileRepresentationForTypeIdentifier:@"public.movie" completionHandler:^(NSURL *url, NSError *error) {
                          if (url) {
                              NSString *destPath = @"/tmp/vcam_video.mp4";
                              NSURL *destURL = [NSURL fileURLWithPath:destPath];
                              [[NSFileManager defaultManager] removeItemAtURL:destURL error:nil];
                              [[NSFileManager defaultManager] copyItemAtURL:url toURL:destURL error:nil];
                              
                              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
                              [defaults setObject:destPath forKey:@"VCamVideoPath"];
                              [defaults setBool:NO forKey:@"VCamEnabled"];
                              [defaults synchronize];
                              
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  self.previewPlayer = [AVPlayer playerWithURL:destURL];
                                  self.previewLayer.player = self.previewPlayer;
                                  [self.previewPlayer play];
                                  [self refreshUI];
                                  CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.supervcam.toggle"), NULL, NULL, YES);
                              });
                          }
                      }];
                  }
              }
          }
          @end

          static VCamPassthroughWindow *floatWindow = nil;

          static void setupGlobalUI() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (!floatWindow) {
                      floatWindow = [[VCamPassthroughWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                      floatWindow.ballBtn.center = CGPointMake(50, 150);
                      floatWindow.panel.center = CGPointMake([UIScreen mainScreen].bounds.size.width / 2, [UIScreen mainScreen].bounds.size.height / 2);
                      floatWindow.hidden = NO;
                  }
              });
          }

          static NSTimeInterval lastVolUpTime = 0;

          %hook SBVolumeControl
          - (void)increaseVolume {
              %orig;
              lastVolUpTime = [[NSDate date] timeIntervalSince1970];
          }
          - (void)decreaseVolume {
              %orig;
              NSTimeInterval now = [[NSDate date] timeIntervalSince1970];
              if (now - lastVolUpTime < 0.5) {
                  if (floatWindow) {
                      dispatch_async(dispatch_get_main_queue(), ^{ 
                          floatWindow.hidden = !floatWindow.hidden; 
                      });
                  }
                  lastVolUpTime = 0;
              }
          }
          %end

          @interface VCFrameInterceptor : NSObject <AVCaptureVideoDataOutputSampleBufferDelegate>
          @property (nonatomic, weak) id<AVCaptureVideoDataOutputSampleBufferDelegate> realDelegate;
          @end
          @implementation VCFrameInterceptor
          - (void)captureOutput:(AVCaptureOutput *)output didOutputSampleBuffer:(CMSampleBufferRef)sampleBuffer fromConnection:(AVCaptureConnection *)connection {
              CMSampleBufferRef vBuf = [[VCFrameEngine shared] replaceSampleBuffer:sampleBuffer];
              if (vBuf) {
                  [self.realDelegate captureOutput:output didOutputSampleBuffer:vBuf fromConnection:connection];
                  CFRelease(vBuf);
              } else {
                  [self.realDelegate captureOutput:output didOutputSampleBuffer:sampleBuffer fromConnection:connection];
              }
          }
          @end

          static void handleCrossProcessNotify(CFNotificationCenterRef center, void *observer, CFNotificationName name, const void *object, CFDictionaryRef userInfo) {
              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
              [[VCFrameEngine shared] syncState];
              NSString *savedPath = [defaults objectForKey:@"VCamVideoPath"];
              if (savedPath) [[VCFrameEngine shared] loadVideoURL:[NSURL fileURLWithPath:savedPath]];
          }

          __attribute__((constructor)) static void initVCam() {
              CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, handleCrossProcessNotify, CFSTR("com.yourname.supervcam.toggle"), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);

              if ([[NSProcessInfo processInfo].processName isEqualToString:@"SpringBoard"]) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{ setupGlobalUI(); });
              } else {
                  NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:@"com.yourname.supervcam"];
                  [[VCFrameEngine shared] syncState];
                  NSString *savedPath = [defaults objectForKey:@"VCamVideoPath"];
                  if (savedPath) [[VCFrameEngine shared] loadVideoURL:[NSURL fileURLWithPath:savedPath]];

                  Class clsV = objc_getClass("AVCaptureVideoDataOutput");
                  Method methodV = class_getInstanceMethod(clsV, sel_registerName("setSampleBufferDelegate:queue:"));
                  if (methodV) {
                      IMP originalIMPV = method_getImplementation(methodV);
                      IMP newIMPV = imp_implementationWithBlock(^void(id _self, id delegate, dispatch_queue_t queue) {
                          if (!delegate) { ((void (*)(id, SEL, id, dispatch_queue_t))originalIMPV)(_self, sel_registerName("setSampleBufferDelegate:queue:"), delegate, queue); return; }
                          VCFrameInterceptor *interceptor = [VCFrameInterceptor new];
                          interceptor.realDelegate = delegate;
                          ((void (*)(id, SEL, id, dispatch_queue_t))originalIMPV)(_self, sel_registerName("setSampleBufferDelegate:queue:"), interceptor, queue);
                      });
                      method_setImplementation(methodV, newIMPV);
                  }
              }
          }
          EOF

      - name: Build
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SuperVCam-Deb
          path: packages/*.deb
