name: Build SuperVCam Pro
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
      - name: Generate Source
        run: |
          mkdir -p .github/workflows
          
          cat > Makefile << 'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:15.0
          THEOS_PACKAGE_SCHEME = rootless
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = SuperVCam
          SuperVCam_FILES = Tweak.x VCFrameEngine.m VCAMProxy.m
          SuperVCam_FRAMEWORKS = AVFoundation CoreMedia CoreVideo CoreImage UIKit Foundation PhotosUI Photos AudioToolbox AVKit
          SuperVCam_CFLAGS = -fobjc-arc
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat > control << 'EOF'
          Package: com.yourname.supervcam
          Name: SuperVCam
          Version: 8.0.0
          Architecture: iphoneos-arm64
          Description: True Data Stream Hijacker
          Maintainer: yourname
          Author: yourname
          Section: Tweaks
          Depends: mobilesubstrate
          EOF

          cat > SuperVCam.plist << 'EOF'
          {
              Filter = {
                  Bundles = (
                      "com.apple.springboard",
                      "com.apple.camera"
                  );
              };
          }
          EOF

          # ================= 核心引擎 (严格按照原相机格式输出) =================
          cat > VCFrameEngine.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <AVFoundation/AVFoundation.h>
          @interface VCFrameEngine : NSObject
          + (instancetype)shared;
          @property (nonatomic, assign) BOOL isEnabled;
          - (void)loadVideoURL:(NSURL *)url;
          - (CMSampleBufferRef)hijackSampleBuffer:(CMSampleBufferRef)originalBuffer CF_RETURNS_RETAINED;
          @end
          EOF

          cat > VCFrameEngine.m << 'EOF'
          #import "VCFrameEngine.h"
          #import <CoreImage/CoreImage.h>

          @interface VCFrameEngine () {
              AVAssetReader *_reader;
              AVAssetReaderTrackOutput *_readerOutput;
              NSURL *_videoURL;
              CIContext *_ciContext;
          }
          @end

          @implementation VCFrameEngine
          + (instancetype)shared {
              static VCFrameEngine *inst;
              static dispatch_once_t once;
              dispatch_once(&once, ^{ inst = [VCFrameEngine new]; });
              return inst;
          }
          - (instancetype)init {
              self = [super init];
              if (self) {
                  _ciContext = [CIContext contextWithOptions:@{kCIContextUseSoftwareRenderer: @NO}];
              }
              return self;
          }
          - (void)loadVideoURL:(NSURL *)url {
              _videoURL = url;
              [self rebuildReader];
          }
          - (void)rebuildReader {
              if (_reader) { [_reader cancelReading]; _reader = nil; }
              if (!_videoURL) return;
              
              AVAsset *asset = [AVAsset assetWithURL:_videoURL];
              _reader = [AVAssetReader assetReaderWithAsset:asset error:nil];
              AVAssetTrack *track = [[asset tracksWithMediaType:AVMediaTypeVideo] firstObject];
              if (track) {
                  _readerOutput = [AVAssetReaderTrackOutput assetReaderTrackOutputWithTrack:track outputSettings:@{
                      (id)kCVPixelBufferPixelFormatTypeKey: @(kCVPixelFormatType_32BGRA)
                  }];
                  _readerOutput.alwaysCopiesSampleData = NO;
                  [_reader addOutput:_readerOutput];
                  [_reader startReading];
              }
          }

          - (CMSampleBufferRef)hijackSampleBuffer:(CMSampleBufferRef)originalBuffer CF_RETURNS_RETAINED {
              if (!self.isEnabled || !_videoURL) return NULL;
              if (!_reader || _reader.status != AVAssetReaderStatusReading) [self rebuildReader];
              
              CMSampleBufferRef videoSb = [_readerOutput copyNextSampleBuffer];
              if (!videoSb) {
                  [self rebuildReader];
                  videoSb = [_readerOutput copyNextSampleBuffer];
                  if (!videoSb) return NULL;
              }

              CVImageBufferRef videoImage = CMSampleBufferGetImageBuffer(videoSb);
              if (!videoImage) { CFRelease(videoSb); return NULL; }
              
              CMFormatDescriptionRef fmtDesc = CMSampleBufferGetFormatDescription(originalBuffer);
              CVImageBufferRef originalImage = CMSampleBufferGetImageBuffer(originalBuffer);
              size_t targetW = CVPixelBufferGetWidth(originalImage);
              size_t targetH = CVPixelBufferGetHeight(originalImage);
              OSType format = CVPixelBufferGetPixelFormatType(originalImage);

              NSUserDefaults *def = [NSUserDefaults standardUserDefaults];
              BOOL isMirror = [def boolForKey:@"VCamMirror"];
              NSInteger angle = [def integerForKey:@"VCamRotation"];
              
              CIImage *ciImage = [CIImage imageWithCVPixelBuffer:videoImage];
              CGFloat scaleX = targetW / ciImage.extent.size.width;
              CGFloat scaleY = targetH / ciImage.extent.size.height;
              
              ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeScale(scaleX, scaleY)];
              ciImage = [ciImage imageByCroppingToRect:CGRectMake(0, 0, targetW, targetH)];
              
              if (isMirror) {
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeScale(-1, 1)];
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeTranslation(targetW, 0)];
              }
              if (angle == 90) {
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeRotation(-M_PI_2)];
                  ciImage = [ciImage imageByApplyingTransform:CGAffineTransformMakeTranslation(0, targetH)];
              }

              CVPixelBufferRef newBuf = NULL;
              NSDictionary *attrs = @{
                  (id)kCVPixelBufferPixelFormatTypeKey: @(format),
                  (id)kCVPixelBufferWidthKey: @(targetW),
                  (id)kCVPixelBufferHeightKey: @(targetH),
                  (id)kCVPixelBufferIOSurfacePropertiesKey: @{}
              };
              CVPixelBufferCreate(kCFAllocatorDefault, targetW, targetH, format, (__bridge CFDictionaryRef)attrs, &newBuf);
              if (newBuf) {
                  [_ciContext render:ciImage toCVPixelBuffer:newBuf];
              }

              CMTime pts = CMSampleBufferGetPresentationTimeStamp(originalBuffer);
              CMSampleTimingInfo timing = { .duration = CMTimeMake(1, 30), .presentationTimeStamp = pts, .decodeTimeStamp = kCMTimeInvalid };
              
              CMSampleBufferRef finalSb = NULL;
              CMSampleBufferCreateReadyWithImageBuffer(kCFAllocatorDefault, newBuf, fmtDesc, &timing, &finalSb);
              
              if (finalSb) {
                  CFArrayRef attArr = CMSampleBufferGetSampleAttachmentsArray(originalBuffer, false);
                  if (attArr && CFArrayGetCount(attArr) > 0) {
                      CFDictionaryRef att = CFArrayGetValueAtIndex(attArr, 0);
                      CMSetAttachments(finalSb, att, kCMAttachmentMode_ShouldPropagate);
                  }
              }

              if (newBuf) CVPixelBufferRelease(newBuf);
              CFRelease(videoSb);
              return finalSb;
          }
          @end
          EOF

          # ================= 代理拦截 =================
          cat > VCAMProxy.h << 'EOF'
          #import <Foundation/Foundation.h>
          #import <AVFoundation/AVFoundation.h>
          @interface VCAMProxy : NSObject <AVCaptureVideoDataOutputSampleBufferDelegate>
          @property (nonatomic, weak) id<AVCaptureVideoDataOutputSampleBufferDelegate> originalDelegate;
          @end
          EOF

          cat > VCAMProxy.m << 'EOF'
          #import "VCAMProxy.h"
          #import "VCFrameEngine.h"

          @implementation VCAMProxy
          - (void)captureOutput:(AVCaptureOutput *)output didOutputSampleBuffer:(CMSampleBufferRef)sampleBuffer fromConnection:(AVCaptureConnection *)connection {
              CMSampleBufferRef fakeSb = [[VCFrameEngine shared] hijackSampleBuffer:sampleBuffer];
              if (fakeSb) {
                  [self.originalDelegate captureOutput:output didOutputSampleBuffer:fakeSb fromConnection:connection];
                  CFRelease(fakeSb);
              } else {
                  [self.originalDelegate captureOutput:output didOutputSampleBuffer:sampleBuffer fromConnection:connection];
              }
          }
          @end
          EOF

          # ================= 模块 3：UI 与 Hook (严格格式化防报错) =================
          cat > Tweak.x << 'EOF'
          #import <AVFoundation/AVFoundation.h>
          #import <UIKit/UIKit.h>
          #import <PhotosUI/PhotosUI.h>
          #import <objc/runtime.h>
          #import "VCAMProxy.h"
          #import "VCFrameEngine.h"

          @interface VCamWindow : UIWindow <PHPickerViewControllerDelegate>
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) UIButton *ballBtn;
          @property (nonatomic, strong) UIButton *btnPick;
          @property (nonatomic, strong) UIButton *btnAudio;
          @property (nonatomic, strong) UIButton *btnMirror;
          @end

          @implementation VCamWindow
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.windowLevel = UIWindowLevelNormal + 10;
                  self.backgroundColor = [UIColor clearColor];
                  self.rootViewController = [[UIViewController alloc] init];
                  self.rootViewController.view.backgroundColor = [UIColor clearColor];
                  
                  self.ballBtn = [UIButton buttonWithType:UIButtonTypeCustom];
                  self.ballBtn.frame = CGRectMake(0, 0, 50, 50);
                  self.ballBtn.backgroundColor = [UIColor colorWithRed:0 green:122/255.0 blue:1 alpha:0.8];
                  self.ballBtn.layer.cornerRadius = 25;
                  [self.ballBtn setTitle:@"V" forState:UIControlStateNormal];
                  [self.ballBtn addTarget:self action:@selector(expand) forControlEvents:UIControlEventTouchUpInside];
                  [self.rootViewController.view addSubview:self.ballBtn];
                  
                  self.panel = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 320, 260)];
                  self.panel.backgroundColor = [UIColor colorWithRed:30/255.0 green:30/255.0 blue:45/255.0 alpha:0.95];
                  self.panel.layer.cornerRadius = 20;
                  self.panel.hidden = YES;
                  self.panel.center = self.rootViewController.view.center;
                  [self.rootViewController.view addSubview:self.panel];

                  UIButton *close = [UIButton buttonWithType:UIButtonTypeSystem];
                  close.frame = CGRectMake(280, 10, 30, 30);
                  [close setTitle:@"✖" forState:UIControlStateNormal];
                  [close setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  [close addTarget:self action:@selector(minimize) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:close];

                  self.btnPick = [UIButton buttonWithType:UIButtonTypeSystem];
                  self.btnPick.frame = CGRectMake(15, 40, 290, 50);
                  self.btnPick.backgroundColor = [UIColor colorWithRed:0 green:122/255.0 blue:1 alpha:1];
                  self.btnPick.layer.cornerRadius = 10;
                  [self.btnPick setTitle:@"🎬 从相册选择视频" forState:UIControlStateNormal];
                  [self.btnPick addTarget:self action:@selector(pickVideo) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:self.btnPick];

                  self.btnAudio = [UIButton buttonWithType:UIButtonTypeSystem];
                  self.btnAudio.frame = CGRectMake(15, 105, 140, 45);
                  self.btnAudio.backgroundColor = [UIColor grayColor];
                  self.btnAudio.layer.cornerRadius = 10;
                  [self.btnAudio setTitle:@"🔇 原声: 关" forState:UIControlStateNormal];
                  [self.btnAudio addTarget:self action:@selector(toggleAudio) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:self.btnAudio];

                  self.btnMirror = [UIButton buttonWithType:UIButtonTypeSystem];
                  self.btnMirror.frame = CGRectMake(165, 105, 140, 45);
                  self.btnMirror.backgroundColor = [UIColor grayColor];
                  self.btnMirror.layer.cornerRadius = 10;
                  [self.btnMirror setTitle:@"↔️ 镜像: 关" forState:UIControlStateNormal];
                  [self.btnMirror addTarget:self action:@selector(toggleMirror) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:self.btnMirror];
                  
                  [self refreshUI];
              }
              return self;
          }

          - (void)expand { self.panel.hidden = NO; }
          - (void)minimize { self.panel.hidden = YES; }

          - (void)toggleAudio {
              BOOL val = [[NSUserDefaults standardUserDefaults] boolForKey:@"VCamAudio"];
              [[NSUserDefaults standardUserDefaults] setBool:!val forKey:@"VCamAudio"];
              [[NSUserDefaults standardUserDefaults] synchronize];
              [self refreshUI];
          }
          - (void)toggleMirror {
              BOOL val = [[NSUserDefaults standardUserDefaults] boolForKey:@"VCamMirror"];
              [[NSUserDefaults standardUserDefaults] setBool:!val forKey:@"VCamMirror"];
              [[NSUserDefaults standardUserDefaults] synchronize];
              [self refreshUI];
          }

          - (void)refreshUI {
              BOOL hasAudio = [[NSUserDefaults standardUserDefaults] boolForKey:@"VCamAudio"];
              [self.btnAudio setTitle:hasAudio ? @"🔊 原声: 开" : @"🔇 原声: 关" forState:UIControlStateNormal];
              self.btnAudio.backgroundColor = hasAudio ? [UIColor greenColor] : [UIColor grayColor];

              BOOL mirror = [[NSUserDefaults standardUserDefaults] boolForKey:@"VCamMirror"];
              [self.btnMirror setTitle:mirror ? @"↔️ 镜像: 开" : @"↔️ 镜像: 关" forState:UIControlStateNormal];
              self.btnMirror.backgroundColor = mirror ? [UIColor greenColor] : [UIColor grayColor];
          }

          - (void)pickVideo {
              PHPickerConfiguration *conf = [[PHPickerConfiguration alloc] init];
              conf.filter = PHPickerFilter.videosFilter;
              PHPickerViewController *picker = [[PHPickerViewController alloc] initWithConfiguration:conf];
              picker.delegate = self;
              [self.rootViewController presentViewController:picker animated:YES completion:nil];
          }

          - (void)picker:(PHPickerViewController *)picker didFinishPicking:(NSArray<PHPickerResult *> *)results {
              [picker dismissViewControllerAnimated:YES completion:nil];
              if (results.count == 0) return;
              
              NSItemProvider *provider = results.firstObject.itemProvider;
              if ([provider hasItemConformingToTypeIdentifier:@"public.movie"]) {
                  [provider loadFileRepresentationForTypeIdentifier:@"public.movie" completionHandler:^(NSURL *url, NSError *error) {
                      if (!url) return;
                      NSString *dest = @"/tmp/vcam_video.mp4";
                      NSURL *destURL = [NSURL fileURLWithPath:dest];
                      [[NSFileManager defaultManager] removeItemAtURL:destURL error:nil];
                      [[NSFileManager defaultManager] copyItemAtURL:url toURL:destURL error:nil];
                      
                      NSUserDefaults *def = [NSUserDefaults standardUserDefaults];
                      [def setObject:dest forKey:@"VCamVideoPath"];
                      [def setBool:YES forKey:@"VCamEnabled"];
                      [def synchronize];
                      
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [[VCFrameEngine shared] loadVideoURL:destURL];
                          [[VCFrameEngine shared] setIsEnabled:YES];
                          [self.btnPick setTitle:@"🟢 已载入(替换生效)" forState:UIControlStateNormal];
                          [self refreshUI];
                      });
                  }];
              }
          }
          @end

          static VCamWindow *uiWindow = nil;
          static NSTimeInterval lastVolUp = 0;

          %hook SBVolumeControl
          - (void)increaseVolume {
              %orig;
              lastVolUp = [[NSDate date] timeIntervalSince1970];
          }
          - (void)decreaseVolume {
              %orig;
              NSTimeInterval now = [[NSDate date] timeIntervalSince1970];
              if (now - lastVolUp < 0.5) {
                  dispatch_async(dispatch_get_main_queue(), ^{ 
                      if (uiWindow) uiWindow.hidden = !uiWindow.hidden; 
                  });
                  lastVolUp = 0;
              }
          }
          %end

          %hook AVCaptureVideoDataOutput
          - (void)setSampleBufferDelegate:(id<AVCaptureVideoDataOutputSampleBufferDelegate>)delegate queue:(dispatch_queue_t)queue {
              %orig;
              if (!delegate) return;
              if ([delegate isKindOfClass:objc_getClass("VCAMProxy")]) return;
              
              VCAMProxy *proxy = [VCAMProxy new];
              proxy.originalDelegate = delegate;
              %orig(proxy, queue);
          }
          %end

          __attribute__((constructor)) static void initVCam() {
              if ([[NSProcessInfo processInfo].processName isEqualToString:@"SpringBoard"]) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      uiWindow = [[VCamWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                      uiWindow.hidden = YES;
                  });
              } else {
                  NSString *path = [[NSUserDefaults standardUserDefaults] objectForKey:@"VCamVideoPath"];
                  if (path) [[VCFrameEngine shared] loadVideoURL:[NSURL fileURLWithPath:path]];
                  [VCFrameEngine shared].isEnabled = [[NSUserDefaults standardUserDefaults] boolForKey:@"VCamEnabled"];
              }
          }
          EOF

      - name: Build
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SuperVCam-Deb
          path: packages/*.deb
